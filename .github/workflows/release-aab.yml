name: Сборка для Google Play (AAB)

# Запуск вручную: Actions → «Сборка для Google Play (AAB)» → Run workflow.
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# В pull request сборка проверяется с временным ключом и никуда не выкладывается.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/release-aab.yml'

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Ключ подписи из секретов
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Не заданы секреты ключа подписи. Добавь 4 секрета ANDROID_* в Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Временный ключ (только проверка в pull request)
        if: github.event_name == 'pull_request'
        run: |
          keytool -genkeypair -v -keystore android/app/upload-keystore.jks -storetype JKS \
            -alias check -keyalg RSA -keysize 2048 -validity 1 \
            -storepass checkpass -keypass checkpass -dname "CN=check"
          printf 'storeFile=upload-keystore.jks\nstorePassword=checkpass\nkeyAlias=check\nkeyPassword=checkpass\n' > android/key.properties

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Номер сборки (versionCode) растёт с каждым запуском: Google Play требует новый номер на каждую загрузку.
      - run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=TG_TOKEN=${{ secrets.TG_TOKEN }} --dart-define=TG_CHAT=${{ secrets.TG_CHAT }}

      # APK той же версии для установки на телефон в обход магазина.
      - run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=TG_TOKEN=${{ secrets.TG_TOKEN }} --dart-define=TG_CHAT=${{ secrets.TG_CHAT }}

      - name: Проверить подпись
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | tail -1
          keytool -printcert -jarfile "$AAB" | head -8

      - name: Убрать ключ с машины сборки
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Переименовать файл
        run: |
          cp build/app/outputs/bundle/release/app-release.aab AstroWay-${{ github.run_number }}.aab
          cp build/app/outputs/flutter-apk/app-release.apk AstroWay-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'AstroWay-check-NE-ZAGRUZHAT' || 'AstroWay-GooglePlay' }}
          path: |
            AstroWay-${{ github.run_number }}.aab
            AstroWay-${{ github.run_number }}.apk

      # Промежуточная сборка из pull request: подписана временным ключом, в Play не загружать.
      # Её забирают, чтобы переподписать настоящим ключом вне GitHub.
      - name: Выложить промежуточную сборку (pull request)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete pr-check-build --yes --cleanup-tag || true
          gh release create pr-check-build AstroWay-${{ github.run_number }}.aab AstroWay-${{ github.run_number }}.apk \
            --prerelease --target "${{ github.event.pull_request.head.sha }}" \
            --title "Промежуточная сборка (не загружать в Play)" \
            --notes "Подписана временным ключом для проверки. Номер сборки: ${{ github.run_number }}."

      - name: Выложить в Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete pr-check-build --yes --cleanup-tag || true
          gh release delete play-build --yes --cleanup-tag || true
          gh release create play-build AstroWay-${{ github.run_number }}.aab AstroWay-${{ github.run_number }}.apk \
            --prerelease \
            --title "Сборка для Google Play" \
            --notes "Подписанный AAB для загрузки в Play Console. Номер сборки: ${{ github.run_number }}. Коммит: ${GITHUB_SHA::7}."
